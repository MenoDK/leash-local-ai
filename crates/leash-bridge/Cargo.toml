[package]
name = "leash-bridge"
description = "Host-to-guest channel: mutual TLS, dormant until activated, typed operations only, fails closed without a heartbeat."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-rustls.workspace = true
x509-parser.workspace = true
tokio-vsock = { version = "0.7", optional = true }

[features]
# Real hypervisor channel (AF_VSOCK). Compile-checked in CI; it needs a VM to run, which CI does not have.
vsock = ["dep:tokio-vsock"]


[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
